# Cursor Worker: a headless Cursor agent for anything that speaks MCP or the OpenAI API.
#
#   cp .env.example .env      # paste CURSOR_API_KEY, generate WORKER_TOKEN
#   docker compose up -d
#
# MCP:      http://<host>:8787/mcp            (Hermes, Claude Code, Open WebUI tools, AI Workspace)
# OpenAI:   http://<host>:8787/v1             (Open WebUI connection, any OpenAI client)
# Jobs:     http://<host>:8787/jobs           (start, poll, stream, cancel)
# Every endpoint except /health needs:  Authorization: Bearer $WORKER_TOKEN

name: cursor-worker

services:
  cursor-worker:
    image: ghcr.io/domdus/cursor-worker:latest
    build: .
    container_name: cursor-worker
    env_file: .env
    ports:
      # Only this machine. Use "8787:8787" to open it to your LAN (WORKER_TOKEN is then required).
      - "127.0.0.1:8787:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - cursor-worker-data:/data
      # A host project as the default workspace (owned by uid 1000, or set user: below):
      # - /path/to/project:/workspace
      # MCP servers every job gets (stdio allowed here, not from requests):
      # - ./mcp.json:/data/mcp.json:ro
      # Git key for GIT_REPO over SSH:
      # - ~/.ssh/id_ed25519:/run/secrets/git_ssh:ro
      # SSH to servers (SSH_KEY / SSH_CONFIG / SSH_KNOWN_HOSTS in .env point here):
      # - ./ssh/worker_key:/run/secrets/worker_ssh_key:ro
      # - ./ssh/config:/run/secrets/ssh_config:ro
      # - ./ssh/known_hosts:/run/secrets/known_hosts:ro
    restart: unless-stopped

  # Optional: Open WebUI already wired to the worker. `docker compose --profile webui up -d`
  open-webui:
    profiles: ["webui"]
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      OPENAI_API_BASE_URL: http://cursor-worker:8787/v1
      OPENAI_API_KEY: ${WORKER_TOKEN}
      # Sends X-OpenWebUI-Chat-Id so one chat keeps one Cursor agent.
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - cursor-worker
    restart: unless-stopped

volumes:
  cursor-worker-data:
  open-webui-data:
